name: Deploy to InfinityFree
 
on:
  push:
    branches:
      - main
  workflow_dispatch: # permite tirarlo manualmente desde la pestaña Actions
 
jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta destino dentro del hosting. Para InfinityFree normalmente es /htdocs/
          # Si tu dominio apunta a una subcarpeta (ej: dominio.com/writingtrainer) ajustá acá.
          server-dir: /htdocs/
          protocol: ftps
          # No hace falta subir estas carpetas/archivos al server
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
 